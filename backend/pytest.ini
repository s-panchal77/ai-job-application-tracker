# backend/pytest.ini

[pytest]

# =============================================================
# WHAT IS pytest.ini?
# =============================================================
# pytest.ini is the configuration file for pytest.
# pytest looks for this file automatically when you run `pytest`.
# It controls HOW pytest discovers, runs, and reports tests.
#
# WHY create this file?
# ─────────────────────
# Without pytest.ini, you'd have to type long command-line flags
# every time you run tests. pytest.ini stores them permanently.
# It also ensures everyone on the team uses the same settings.
# =============================================================


# =============================================================
# TEST DISCOVERY SETTINGS
# =============================================================

# testpaths: WHERE should pytest look for tests?
# ─────────────────────────────────────────────────
# By default pytest searches the entire project.
# We restrict it to 'tests/' to avoid scanning node_modules,
# venv, migrations, or other folders accidentally.
testpaths = tests

# python_files: WHAT file naming pattern are test files?
# ──────────────────────────────────────────────────────
# pytest will only collect files matching this pattern.
# 'test_*.py' means: any file starting with 'test_'
#   ✓ test_auth.py      (collected)
#   ✓ test_jobs.py      (collected)
#   ✗ conftest.py       (not collected, shared fixtures only)
#   ✗ utils.py          (not collected, not a test file)
python_files = test_*.py

# python_classes: WHAT class naming pattern are test classes?
# ──────────────────────────────────────────────────────────
# Classes starting with 'Test' are treated as test containers.
#   ✓ class TestRegistration:   (collected)
#   ✗ class HelperClass:        (not collected)
python_classes = Test*

# python_functions: WHAT function naming pattern are test functions?
# ─────────────────────────────────────────────────────────────────
# Individual test functions must start with 'test_'.
#   ✓ def test_register_success(self):   (collected)
#   ✗ def helper_function(self):         (not collected)
python_functions = test_*


# =============================================================
# OUTPUT SETTINGS
# =============================================================

# addopts: Additional command-line options applied automatically.
# ───────────────────────────────────────────────────────────────
# These are the same as typing them on the command line every time.
#
# -v (verbose):
#   Shows each test name individually:
#     tests/test_auth.py::TestRegistration::test_register_success PASSED  <- YES
#   Without -v, only a summary: "10 passed" <- LESS useful
#
# -p no:warnings:
#   Suppresses Python deprecation warnings from third-party libraries.
#   Our test output is cluttered with warnings from passlib, jose, etc.
#   that are not our bugs. This keeps output clean.
#   Remove this if you WANT to see warnings.
#
# --tb=short:
#   Controls how much of the traceback is shown when a test fails.
#   'short'  → 5-10 lines of the most relevant stack frames  <- RECOMMENDED
#   'long'   → full traceback (can be 100+ lines)
#   'no'     → no traceback (just shows which test failed)
#   'line'   → single line per failure
#
# --strict-markers:
#   If you use @pytest.mark.something, it must be declared here first.
#   Prevents typos like @pytest.mark.slwo (wrong spelling).
addopts = -v --tb=short -p no:warnings


# =============================================================
# MARKERS (Custom test categories)
# =============================================================
# Markers let you label and selectively run tests.
#
# Define markers here to avoid "unknown mark" warnings.
# Then use them as:
#   @pytest.mark.slow
#   def test_that_takes_long(): ...
#
# Run only slow tests:   pytest -m slow
# Skip slow tests:       pytest -m "not slow"
#
# Built-in markers (always available):
#   @pytest.mark.skip           — Always skip this test
#   @pytest.mark.skipif(cond)   — Skip conditionally
#   @pytest.mark.xfail          — Expect this test to fail (known bug)
#   @pytest.mark.parametrize    — Run test with multiple inputs
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks integration tests that need external services
    unit: marks pure unit tests with no I/O


# =============================================================
# LOGGING
# =============================================================

# log_cli: Show logging output in the terminal during test run.
# ─────────────────────────────────────────────────────────────
# false = logging is captured, only shown if a test fails
# true  = logging is shown live as tests run (noisy, but useful for debugging)
log_cli = false
log_cli_level = INFO

# log_level: What level of log messages to capture internally.
# ─────────────────────────────────────────────────────────────
# Captured logs are shown in the failure report.
# DEBUG = capture everything; WARNING = only problems
log_level = DEBUG
